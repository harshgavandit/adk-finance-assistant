name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENAI_API_KEY: offline-ci-dummy-key
      LLM_MODEL: gpt-4o-mini
      PYTHONUTF8: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      LITELLM_LOG: ERROR
    defaults:
      run:
        working-directory: ADK_Finance_Assistance_Agent
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ADK_Finance_Assistance_Agent/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline regression tests
        run: python -m pytest -q
      - name: Verify offline configuration
        run: python verify.py
      - name: Compile application source
        run: python -m compileall -q finance_runtime finance_assistant_agent investment_plan_agent verify.py
      - name: Check tracked files for private data
        run: python ../scripts/check_publishable.py
